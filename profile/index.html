<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Goa Design</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: CanvasText;
        background: Canvas;
      }

      main {
        max-width: 760px;
        padding: 48px 24px;
        text-align: center;
      }

      img {
        max-width: 100%;
        height: auto;
      }

      h1 {
        margin: 32px 0 16px;
        font-size: clamp(2rem, 5vw, 3.5rem);
        line-height: 1.1;
      }

      p {
        font-size: 1.125rem;
        line-height: 1.6;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin-top: 32px;
      }

      a {
        color: LinkText;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/goadesign-banner.png" alt="Goa Design">
      <h1>Design-first Go infrastructure</h1>
      <p>
        Goa Design builds design-first tooling for APIs, services, agents, and
        distributed systems. Define contracts once; generate the code, schemas,
        transports, docs, clients, tools, and runtime glue that keep production
        systems honest.
      </p>
      <nav aria-label="Goa Design links">
        <a href="https://goa.design">Documentation</a>
        <a href="https://github.com/goadesign/goa">Goa</a>
        <a href="https://github.com/goadesign/goa-ai">Goa-AI</a>
        <a href="https://github.com/goadesign/examples">Examples</a>
      </nav>
    </main>
  </body>
</html>
